name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout ObsidianVault
        uses: actions/checkout@v6
        with:
          repository: CNPZJACE/ObsidianVault
          token: ${{ secrets.OBSIDIAN_TOKEN }}
          path: obsidian-vault

      - name: Copy Learn notes to Quartz
        run: |
          rm -rf content/*
          cp -R obsidian-vault/Learn/. content/
          echo "Files copied from ObsidianVault/Learn:"
          find content -type f

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      - name: Check output (no third-party fonts, robots.txt present)
        run: |
          if grep -rl "fonts.gstatic.com\|fonts.googleapis.com" public --include="*.html" | head -n 1; then
            echo "::error::页面仍在请求 Google Fonts，检查 theme.fontOrigin / configuration.fonts.fontOrigin"
            exit 1
          fi
          test -f public/robots.txt || { echo "::error::robots.txt 未生成"; exit 1; }
          echo "OK: 无外部字体请求，robots.txt 已生成"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
